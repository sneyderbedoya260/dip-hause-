services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - appdata:/data          # base de datos SQLite, archivos subidos y copias
    expose: ["3000"]

  caddy:                       # HTTPS automático (Let's Encrypt) + proxy
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  appdata:
  caddy_data:
  caddy_config:
